      .role { font: 600 26px 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif; fill: url(#accent); letter-spacing: 1px; }
      .tag  { font: 400 22px 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif; fill: #94a3b8; }
      .lbl  { font: 500 13px 'Cascadia Code', 'SFMono-Regular', Consolas, 'Liberation Mono', monospace; fill: #64748b; }
      .mono { font: 500 15px 'Cascadia Code', 'SFMono-Regular', Consolas, 'Liberation Mono', monospace; fill: #cbd5e1; }
      .node { font: 600 15px 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif; fill: #e2e8f0; }
      .sub  { font: 400 13px 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif; fill: #94a3b8; }
      .big  { font: 700 40px 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif; fill: url(#accent); }
    </style>
